name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run launcher offline and migration tests
        run: bash tests/run.sh
      - name: Run queue option tests
        run: bash tests/queue-options.sh
      - name: Run workspace AGENTS context tests
        run: bash tests/workspace-context.sh
      - name: Run managed skill updater tests
        run: bash tests/update-managed-skills.sh
      - name: Run canonical managed skill updater tests
        run: bash tests/update-managed-skills-canonical.sh
