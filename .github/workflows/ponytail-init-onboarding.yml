name: Apply Ponytail init cleanup

on:
  push:
    branches:
      - ponytail-init-onboarding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ponytail-init-onboarding
      - name: Apply minimal cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pj = Path('pj')
          text = pj.read_text()
          old = '''launch_dir="$PWD"
          workspace="${PJ_WORKSPACE:-$HOME/planning}"
          cd "$workspace" || exit 1

          config_home='''
          new = '''launch_dir="$PWD"
          workspace="${PJ_WORKSPACE:-$HOME/planning}"

          config_home='''
          if old not in text:
              raise SystemExit('top-level workspace cd changed unexpectedly')
          text = text.replace(old, new, 1)
          old = '''  exec bash "$updater"
          fi

          launcher_name='''
          new = '''  exec bash "$updater"
          fi

          cd "$workspace" || exit 1

          launcher_name='''
          if old not in text:
              raise SystemExit('launcher boundary changed unexpectedly')
          pj.write_text(text.replace(old, new, 1))

          test = Path('tests/add-skill.sh')
          text = test.read_text()
          old = '''pj="$operator_dir/pj"
          tmp="$(mktemp -d)" || exit 1
'''
          new = '''pj="$operator_dir/pj"
          . "$operator_dir/tests/helpers.sh"
          tmp="$(mktemp -d)" || exit 1
'''
          if old not in text:
              raise SystemExit('test prologue changed unexpectedly')
          text = text.replace(old, new, 1)
          old = '''workspace="$tmp/home/planning"
          target="$tmp/target"
          mkdir -p "$workspace" "$target/subdir" "$tmp/bin" || exit 1
'''
          new = '''workspace="$tmp/home/planning"
          target="$tmp/target"
          mkdir -p "$target/subdir" "$tmp/bin" || exit 1
'''
          if old not in text:
              raise SystemExit('workspace fixture changed unexpectedly')
          text = text.replace(old, new, 1)

          replacements = {
          '''case "$output" in
            *"pj: added github-projects to $target"*) ;;
            *) exit 1 ;;
          esac
          case "$output" in
            *"bash .agents/skills/github-projects/scripts/init-project.sh"*) ;;
            *) exit 1 ;;
          esac
          ''': '''assert_contains "$output" "pj: added github-projects to $target"
          assert_contains "$output" "bash .agents/skills/github-projects/scripts/init-project.sh"
          ''',
          '''case "$second" in
            *"already has github-projects; use 'pj --update-skill' to refresh it"*) ;;
            *) exit 1 ;;
          esac
          ''': '''assert_contains "$second" "already has github-projects; use 'pj --update-skill' to refresh it"
          ''',
          '''case "$init_output" in
            *"pj: added github-projects to $init_target"*) ;;
            *) exit 1 ;;
          esac
          ''': '''assert_contains "$init_output" "pj: added github-projects to $init_target"
          ''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected add-skill assertion block changed unexpectedly')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
      - name: Run complete offline suite
        run: for f in tests/*.sh; do bash "$f"; done
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pj tests/add-skill.sh
          git commit -m 'Ponytail pj init onboarding'
          git push origin HEAD:ponytail-init-onboarding
